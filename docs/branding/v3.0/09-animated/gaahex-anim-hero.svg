<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400"><style>
 .cell{fill:#1C3B68;stroke:#1C3B68;stroke-width:2.108;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
 .c2,.c3{fill:#0EA5E9;stroke:#0EA5E9}
 .tip{fill:#C5A059;transform-box:fill-box;transform-origin:center}
 /* HERO = continuous signature loop (assemble once, then breathe + azure shimmer + gold pulse forever) */
 .stage{animation:assemble 1.1s ease-out both, breathe 4s ease-in-out 1.1s infinite}
 .c2,.c3{animation:shimmer 2.4s ease-in-out 1.1s infinite}
 .tip{animation:goldpulse 2.4s ease-in-out 1.1s infinite}
 @keyframes assemble{from{opacity:0;transform:scale(.6) translateY(10px)}to{opacity:1;transform:none}}
 @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
 @keyframes shimmer{0%,100%{fill:#0EA5E9;stroke:#0EA5E9}50%{fill:#38BDF8;stroke:#38BDF8}}
 @keyframes goldpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
 @media (prefers-reduced-motion:reduce){.stage,.c2,.c3,.tip{animation:none}}
 </style><g class="stage" transform="translate(54.62,-49.83) scale(1.6655)"><path d="M109.06 42.86 L90.80 32.32 L72.54 42.86 L72.54 63.94 L90.80 74.48 L109.06 63.94 Z" class="cell c0"/><path d="M147.46 75.06 L129.20 64.52 L110.94 75.06 L110.94 96.14 L129.20 106.68 L147.46 96.14 Z" class="cell c1"/><path d="M185.86 107.26 L167.60 96.72 L149.34 107.26 L149.34 128.34 L167.60 138.88 L185.86 128.34 Z" class="cell c2"/><path d="M185.86 171.66 L167.60 161.12 L149.34 171.66 L149.34 192.74 L167.60 203.28 L185.86 192.74 Z" class="cell c3"/><path d="M147.46 203.86 L129.20 193.32 L110.94 203.86 L110.94 224.94 L129.20 235.48 L147.46 224.94 Z" class="cell c4"/><path d="M109.06 236.06 L90.80 225.52 L72.54 236.06 L72.54 257.14 L90.80 267.68 L109.06 257.14 Z" class="cell c5"/><path class="tip" d="M224.26 139.46 L206.00 128.92 L187.74 139.46 L187.74 160.54 L206.00 171.08 L224.26 160.54 Z"/></g></svg>