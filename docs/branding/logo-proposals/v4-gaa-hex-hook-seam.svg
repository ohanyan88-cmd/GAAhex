<svg xmlns="http://www.w3.org/2000/svg" viewBox="360 360 560 560" role="img" aria-label="GAAhex mark v4 — G hook holds the AA hexagram with gold seam bond">
  <!--
    GAAhex logo mark — v4 (mark-only, no wordmark)
    Brand : GAAhex (G + A + A = Gev + Anna + )
    Date  : 2026-06-04
    Concept tag: "Hook + Seam layered: G hook holds the AA hexagram; gold seam reveals the Anna- bond"
    Geometry: flat-top hexagons, circumradius s = 60, axial spacing 90 x 103.923, centered on (640, 640).
    Tokens (locked, all from design-system/gaahex-tokens.css):
      gold-500 #C5A059   (A1/A2 bond seam, center cell, A1 dots)
      cobalt-600 #2A5187 (G-hook ring-2 outline stroke)
      gx-bg-subtle #0E1A2D (A1 trio fill — darker upward A)
      gx-surface #13203A   (A2 trio fill — lighter downward A)
      cobalt-900 #0F2138   (hairline cell separators inside cluster)
    Structure (groups, surgical-patch friendly):
      g#g-hook       — 10 ring-2 cells silhouetting the G, outline only, mouth opens right
      g#aa-hexagram  — 7 inner cells (3 A1 dotted + 3 A2 lighter + 1 gold center) with A1 dot pins
      g#bond-seam    — gold seam (central hexagon + 6 outward rays) riding A1/A2/center shared edges
    Notes:
      - No background, transparent canvas — mark must sit on any surface.
      - No wordmark — wordmark variants live in a separate file.
      - viewBox is square (560 x 560) for clean favicon downscaling.
  -->

  <defs>
    <!-- Reusable hex: flat-top, circumradius 60, centered at (0,0). -->
    <symbol id="hex" overflow="visible">
      <polygon points="60,0 30,51.962 -30,51.962 -60,0 -30,-51.962 30,-51.962"/>
    </symbol>
  </defs>

  <!-- ============== G HOOK (ring-2, outline-only) ==============
       10 of 12 ring-2 positions; omits 2 o'clock and 3 o'clock so the mouth opens to the right.
       Included: 12, 11, 10, 9, 8, 7, 6, 5, 4, 1   (8 o'clock kept to preserve lower-left spine continuity)
       Stroke: cobalt-600 (mid tonal) so the G reads as structural outline,
       distinct from the filled hexagram and the gold seam inside.
  -->
  <g id="g-hook" fill="none" stroke="#2A5187" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <use id="g-12" href="#hex" x="640" y="432.154"/>
    <use id="g-11" href="#hex" x="550" y="484.115"/>
    <use id="g-10" href="#hex" x="460" y="536.077"/>
    <use id="g-09" href="#hex" x="460" y="640"/>
    <use id="g-08" href="#hex" x="460" y="743.923"/>
    <use id="g-07" href="#hex" x="550" y="795.885"/>
    <use id="g-06" href="#hex" x="640" y="847.846"/>
    <use id="g-05" href="#hex" x="730" y="795.885"/>
    <use id="g-04" href="#hex" x="820" y="743.923"/>
    <!-- 3 o'clock OMITTED — mouth opening -->
    <!-- 2 o'clock OMITTED — wider mouth than v3 -->
    <use id="g-01" href="#hex" x="730" y="484.115"/>
  </g>

  <!-- ============== AA HEXAGRAM (7 inner cells) ==============
       A1 trio (upward A, dotted darker)  : N, SE, SW  — fill gx-bg-subtle #0E1A2D, gold dot pin
       A2 trio (downward A, lighter)      : NE, S, NW  — fill gx-surface #13203A
       Center                              : gold #C5A059 — the shared crossbar of the AA
       Cell separators: hairline cobalt-900 stroke so cells read as distinct facets.
  -->
  <g id="aa-hexagram" stroke="#0F2138" stroke-width="1.5" stroke-linejoin="round">
    <!-- A2 (lighter / downward A) underneath so A1 reads slightly forward -->
    <use id="i-NE" href="#hex" x="730" y="588.038" fill="#13203A"/>
    <use id="i-S"  href="#hex" x="640" y="743.923" fill="#13203A"/>
    <use id="i-NW" href="#hex" x="550" y="588.038" fill="#13203A"/>
    <!-- A1 (darker / upward A) -->
    <use id="i-N"  href="#hex" x="640" y="536.077" fill="#0E1A2D"/>
    <use id="i-SE" href="#hex" x="730" y="691.962" fill="#0E1A2D"/>
    <use id="i-SW" href="#hex" x="550" y="691.962" fill="#0E1A2D"/>
    <!-- Center: gold crossbar -->
    <use id="i-center" href="#hex" x="640" y="640" fill="#C5A059"/>

    <!-- A1 dot pins (gold), one per dotted-darker cell, sized to read at small scales -->
    <g id="a1-dots" fill="#C5A059" stroke="none">
      <circle cx="640" cy="536.077" r="6"/>
      <circle cx="730" cy="691.962" r="6"/>
      <circle cx="550" cy="691.962" r="6"/>
    </g>
  </g>

  <!-- ============== BOND SEAM (gold) ==============
       Six-pointed star ornament riding the A1/A2/center shared edges.
       Composition:
         1. Central hexagon outline = the 6 shared edges between center cell and ring-1 cells.
         2. Six outward rays = the 6 inter-ring-1 seams (A1 ↔ A2 boundaries),
            each running from a center-hex corner out to the outermost ring-1 vertex.
       Together they trace a Star-of-David silhouette inside the AA hexagram.
       Stroke gold-500, no fill, slight line weight increase to read over the gold center.
  -->
  <g id="bond-seam" fill="none" stroke="#C5A059" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round">
    <!-- Central hexagon (center cell perimeter) -->
    <polygon points="670,588.038 700,640 670,691.962 610,691.962 580,640 610,588.038"/>
    <!-- Six outward rays from each center-hex corner to the outer ring-1 tip -->
    <line x1="670" y1="588.038" x2="700" y2="536.077"/> <!-- N to NE tip   -->
    <line x1="700" y1="640"     x2="760" y2="640"/>     <!-- NE to SE tip  -->
    <line x1="670" y1="691.962" x2="700" y2="743.923"/> <!-- SE to S tip   -->
    <line x1="610" y1="691.962" x2="580" y2="743.923"/> <!-- S to SW tip   -->
    <line x1="580" y1="640"     x2="520" y2="640"/>     <!-- SW to NW tip  -->
    <line x1="610" y1="588.038" x2="580" y2="536.077"/> <!-- NW to N tip   -->
  </g>
</svg>
