<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1280" role="img" aria-label="GAAhex mark — G surrounding AA hex cluster (v3, primary)">
  <!--
    GAAhex logo mark — v3, "G silhouette around AA cluster"
    ============================================================
    Geometry: flat-top hexagons, circumradius s = 60.
    Inner cluster: 7 hexes (1 center + 6 ring-1) = the "AA" pair (two upside-down A triangles read inside the cluster).
    Outer ring: 11 of 12 possible ring-2 hexes, arranged to silhouette the letter "G".
      - The mouth of the G opens at 3 o'clock (mid-right) — the single omitted ring-2 position.
      - The 4 o'clock hex (lower mid-right) reads as the G's tongue.
    Colors (locked tokens):
      cobalt #1C3B68 · cobalt-deep #142C4E · gold #C5A059 · slate-blue ring stroke #3B5B8E
      canvas radial #070B1F → #162247  (per orchestrator brief, deeper than --gx-bg)
      cyan status dot #4FB6E6 · gold status dot #C5A059
    Type: 'IBM Plex Sans', 'Inter', system-ui, sans-serif (no Arial — defect from prod logo not repeated).
    Groups are id'd for surgical patching:
      #bg, #ambient, #outer-ring (each hex own id), #inner-cluster (each hex own id), #wordmark, #status-dots.
  -->

  <defs>
    <!-- Canvas background: deep-cobalt radial, deeper than app --gx-bg so the mark sits "on a brand surface" not in a UI shell. -->
    <radialGradient id="canvas" cx="50%" cy="50%" r="65%">
      <stop offset="0"   stop-color="#162247"/>
      <stop offset="0.55" stop-color="#0C1531"/>
      <stop offset="1"   stop-color="#070B1F"/>
    </radialGradient>

    <!-- Ambient halo around the cluster — cobalt-500 glow, soft. -->
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0"   stop-color="#2A5187" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#1C3B68" stop-opacity="0.12"/>
      <stop offset="1"   stop-color="#1C3B68" stop-opacity="0"/>
    </radialGradient>

    <!-- Cobalt fill for the 6 ring-1 hexes; subtle 1-stop top-light shift, still matte. -->
    <linearGradient id="cobaltFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22467A"/>
      <stop offset="1" stop-color="#15315A"/>
    </linearGradient>

    <!-- Center-hex inner fill: deeper cobalt so the gold border + wordmark pop. -->
    <linearGradient id="centerFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E1F3E"/>
      <stop offset="1" stop-color="#091428"/>
    </linearGradient>

    <!-- Reusable hex path: flat-top, circumradius 60, centered at (0,0). -->
    <symbol id="hex" overflow="visible">
      <polygon points="60,0 30,51.962 -30,51.962 -60,0 -30,-51.962 30,-51.962"/>
    </symbol>
  </defs>

  <!-- ============== BACKGROUND ============== -->
  <g id="bg">
    <rect x="0" y="0" width="1280" height="1280" fill="url(#canvas)"/>
  </g>

  <!-- ============== AMBIENT HALO ============== -->
  <g id="ambient">
    <circle cx="640" cy="640" r="430" fill="url(#halo)"/>
  </g>

  <!-- ============== OUTER RING — G SILHOUETTE ==============
       11 of 12 ring-2 candidate positions. The omitted one is mid-right (3 o'clock)
       which becomes the G's "mouth" opening. The 4 o'clock hex reads as the tongue.
       Each hex has its own id so Gev/orchestrator can tune individual positions.
       Stroke: slate-blue, low-opacity fill (the "ghost" quality).
  -->
  <g id="outer-ring" fill="#1C3B68" fill-opacity="0.10" stroke="#3B5B8E" stroke-opacity="0.85" stroke-width="2.5" stroke-linejoin="round">
    <!-- 12 o'clock (top) -->
    <use id="o-12" href="#hex" x="640" y="432.154"/>
    <!-- 11 o'clock (top-left curl) -->
    <use id="o-11" href="#hex" x="550" y="484.115"/>
    <!-- 10 o'clock (upper-left) -->
    <use id="o-10" href="#hex" x="460" y="536.077"/>
    <!--  9 o'clock (left, spine of the G) -->
    <use id="o-09" href="#hex" x="460" y="640"/>
    <!--  8 o'clock (lower-left) -->
    <use id="o-08" href="#hex" x="460" y="743.923"/>
    <!--  7 o'clock (bottom-left curl) -->
    <use id="o-07" href="#hex" x="550" y="795.885"/>
    <!--  6 o'clock (bottom) -->
    <use id="o-06" href="#hex" x="640" y="847.846"/>
    <!--  5 o'clock (bottom-right curl) -->
    <use id="o-05" href="#hex" x="730" y="795.885"/>
    <!--  4 o'clock (the G's tongue) -->
    <use id="o-04" href="#hex" x="820" y="743.923"/>
    <!--  3 o'clock OMITTED — this is the G's mouth opening. -->
    <!--  2 o'clock (top-right closure, completes the G's upper hook) -->
    <use id="o-02" href="#hex" x="820" y="536.077"/>
    <!--  1 o'clock (top-right curl) -->
    <use id="o-01" href="#hex" x="730" y="484.115"/>
  </g>

  <!-- ============== INNER CLUSTER — 7 SOLID HEXES ("AA") ==============
       The 6 cobalt ring-1 hexes around 1 gold-bordered center.
       Composition LOCKED by Gev — do not redesign.
  -->
  <g id="inner-cluster" stroke="#0A1322" stroke-width="2" stroke-linejoin="round">
    <!-- Ring-1 six neighbors, cobalt solid -->
    <use id="i-N"  href="#hex" x="640" y="536.077" fill="url(#cobaltFill)"/>
    <use id="i-NE" href="#hex" x="730" y="588.038" fill="url(#cobaltFill)"/>
    <use id="i-SE" href="#hex" x="730" y="691.962" fill="url(#cobaltFill)"/>
    <use id="i-S"  href="#hex" x="640" y="743.923" fill="url(#cobaltFill)"/>
    <use id="i-SW" href="#hex" x="550" y="691.962" fill="url(#cobaltFill)"/>
    <use id="i-NW" href="#hex" x="550" y="588.038" fill="url(#cobaltFill)"/>

    <!-- Center hex: deep cobalt fill, gold border, carries the GAA + HEX wordmark. -->
    <g id="i-center">
      <use href="#hex" x="640" y="640" fill="url(#centerFill)" stroke="#C5A059" stroke-width="3.5"/>
    </g>
  </g>

  <!-- ============== WORDMARK (inside center hex) ============== -->
  <g id="wordmark" font-family="'IBM Plex Sans', 'Inter', system-ui, sans-serif" text-anchor="middle">
    <!-- "GAA" — large, white, the daughters + the father condensed -->
    <text x="640" y="636"
          font-size="38" font-weight="700"
          fill="#F4F7FB" letter-spacing="2">GAA</text>
    <!-- "HEX" — small, gold, the partner mark -->
    <text x="640" y="670"
          font-size="14" font-weight="600"
          fill="#C5A059" letter-spacing="4">HEX</text>
  </g>

  <!-- ============== STATUS DOTS ==============
       Three small dots on the ring-1 hexes per Gev's spec:
         · cyan on TOP hex (i-N)
         · cyan on LOWER-LEFT hex (i-SW)
         · gold on LOWER-RIGHT hex (i-SE)
       Positioned near the outer vertex of each hex so they read as "status pins."
  -->
  <g id="status-dots" stroke="#0A1322" stroke-width="1.5">
    <!-- TOP hex (i-N) — top-right vertex area -->
    <circle cx="668" cy="510" r="7.5" fill="#4FB6E6"/>
    <!-- LOWER-LEFT hex (i-SW) — bottom-left vertex area -->
    <circle cx="522" cy="718" r="7.5" fill="#4FB6E6"/>
    <!-- LOWER-RIGHT hex (i-SE) — bottom-right vertex area -->
    <circle cx="758" cy="718" r="7.5" fill="#C5A059"/>
  </g>
</svg>
