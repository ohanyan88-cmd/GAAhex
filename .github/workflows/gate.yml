name: gate
on:
  push:
  pull_request:

# The RATCHET gate: typecheck + tests run GLOBAL (must always be green); lint + format
# run only on the files changed vs the target (legacy grandfathered). Blocks the merge.
jobs:
  gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck (global)
        run: npm run typecheck
      - name: Tests (global)
        run: npm run test
      - name: Lint + format changed files (ratchet)
        run: npm run gate:lint-changed
        env:
          GATE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
