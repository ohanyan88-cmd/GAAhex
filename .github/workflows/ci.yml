name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest + ruff + pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gaaex
          POSTGRES_PASSWORD: gaaex
          POSTGRES_DB: gaaex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gaaex -d gaaex_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://gaaex:gaaex@localhost:5432/gaaex_test
      OWNER_DATABASE_URL: postgresql+asyncpg://gaaex:gaaex@localhost:5432/gaaex_test
      REDIS_URL: redis://localhost:6379/0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt', 'backend/requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install ruff pip-audit

      # NOTE: using --exit-zero for the first CI run so pre-existing lint
      # findings don't block the pipeline. Tighten this (drop --exit-zero)
      # once the backlog is cleaned up.
      - name: Lint (ruff)
        working-directory: backend
        run: ruff check app/ --exit-zero

      - name: Tests (pytest)
        working-directory: backend
        run: pytest --tb=short -q

      - name: Dependency audit (pip-audit, warn only)
        working-directory: backend
        continue-on-error: true
        run: pip-audit -r requirements.txt --strict

  frontend:
    name: Frontend (tsc + npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Dependency audit (npm audit, warn only)
        working-directory: frontend
        continue-on-error: true
        run: npm audit --audit-level=high

  secret-scan:
    name: Secret scan (gitleaks, warn only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
