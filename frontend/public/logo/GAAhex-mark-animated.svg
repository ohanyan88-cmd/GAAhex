<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<style>
  /* Continuous build-in WAVE: each hexagon cell rises (scale + opacity) in flow order, the
     gold tip last, then settles — looping forever. Never fully blanks (0.25 floor) so it reads
     as a living flow, not a flicker. Geometry + colors identical to GAAhex-mark.svg. */
  .cell {
    transform-box: fill-box;
    transform-origin: center;
    opacity: 1;                 /* resting state — visible even if motion is disabled */
    animation: gx-wave 4s ease-in-out infinite;
  }
  .c1 { animation-delay: 0s; }
  .c2 { animation-delay: 0.24s; }
  .c3 { animation-delay: 0.48s; }
  .c4 { animation-delay: 0.72s; }
  .c5 { animation-delay: 0.96s; }
  .c6 { animation-delay: 1.20s; }
  .c7 { animation-delay: 1.50s; }
  @keyframes gx-wave {
    0%   { opacity: 0.25; transform: scale(0.6); }
    25%  { opacity: 1;    transform: scale(1); }
    65%  { opacity: 1;    transform: scale(1); }
    100% { opacity: 0.25; transform: scale(0.6); }
  }
</style>
<g transform="translate(24.85,16.01) scale(3.3066)">
