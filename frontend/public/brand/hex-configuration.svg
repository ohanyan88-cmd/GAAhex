    <polygon points="560,530 663.9,590 663.9,710 560,770 456.1,710 456.1,590" stroke="#A78BE6" stroke-opacity="0.18"/>
    <polygon points="840,310 917.9,355 917.9,445 840,490 762.1,445 762.1,355" stroke="#3FCB86" stroke-opacity="0.13"/>
