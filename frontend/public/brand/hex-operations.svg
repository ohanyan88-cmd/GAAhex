<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <!-- GAAhex brand hex field — multi-colour, each hex glows its own colour. Per-page-type variant. -->
  <defs>
    <filter id="g" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g fill="none" stroke-width="3.5" filter="url(#g)">
    <polygon points="100,60 411.8,240 411.8,600 100,780 -211.8,600 -211.8,240" stroke="#6A9BE0" stroke-opacity="0.22"/>
    <polygon points="1500,-220 1811.8,-40 1811.8,320 1500,500 1188.2,320 1188.2,-40" stroke="#4FB8F0" stroke-opacity="0.2"/>
    <polygon points="1100,640 1255.9,730 1255.9,910 1100,1000 944.1,910 944.1,730" stroke="#E6CC93" stroke-opacity="0.2"/>
    <polygon points="650,40 745.3,95 745.3,205 650,260 554.7,205 554.7,95" stroke="#3FCB86" stroke-opacity="0.18"/>
    <polygon points="1350,430 1427.9,475 1427.9,565 1350,610 1272.1,565 1272.1,475" stroke="#A78BE6" stroke-opacity="0.14"/>
  </g>
</svg>
