<!DOCTYPE html><html data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css"><link rel="stylesheet" href="_components.css"><script src="https://unpkg.com/lucide@latest"></script></head><body><div class="card-wrap"><div class="lbl">ISP status primitives</div>
<div class="wrap"><span class="pill pill-success"><span class="d" style="background:var(--gx-online)"></span>Online</span><span class="pill pill-warning"><span class="d" style="background:var(--gx-degraded)"></span>Degraded</span><span class="pill pill-neutral"><span class="d" style="background:var(--gx-offline)"></span>Offline</span><span class="pill" style="background:var(--gx-violet-soft,#8B6FD622);color:var(--gx-maintenance)"><span class="d" style="background:var(--gx-maintenance)"></span>Maintenance</span></div>
<div class="wrap"><span class="pill pill-success">SLA met</span><span class="pill pill-warning">SLA at-risk</span><span class="pill pill-danger">SLA breached</span></div>
<div class="wrap"><span class="lbl">Priority</span><span class="pill pill-danger"><i data-lucide="chevron-up" style="width:12px;height:12px"></i>Critical</span><span class="pill pill-warning">High</span><span class="pill pill-info">Normal</span><span class="pill pill-neutral">Low</span></div>
<div class="wrap"><span class="lbl">Signal</span><span class="row" style="gap:2px;align-items:flex-end;height:16px"><span style="width:4px;height:6px;border-radius:1px;background:var(--gx-quality-good)"></span><span style="width:4px;height:9px;border-radius:1px;background:var(--gx-quality-good)"></span><span style="width:4px;height:12px;border-radius:1px;background:var(--gx-quality-good)"></span><span style="width:4px;height:15px;border-radius:1px;background:var(--gx-border-strong)"></span></span><span class="mono muted" style="font-size:11px">-58 dBm</span></div></div><script>lucide.createIcons();</script></body></html>
