<!DOCTYPE html><html data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css"></head><body><div class="card-wrap"><div class="lbl">Semantic status</div><div class="wrap" style="flex-wrap:nowrap">
<div class="swatch" style="flex:1"><div class="dot" style="background:var(--gx-success)"></div><div class="nm">Success</div><div class="row" style="margin-top:6px;gap:6px"><span class="chip" style="background:var(--gx-success-soft);color:var(--gx-success-fg)">soft</span><span class="hx">var(--gx-success)</span></div></div>
<div class="swatch" style="flex:1"><div class="dot" style="background:var(--gx-warning)"></div><div class="nm">Warning</div><div class="row" style="margin-top:6px;gap:6px"><span class="chip" style="background:var(--gx-warning-soft);color:var(--gx-warning-fg)">soft</span><span class="hx">var(--gx-warning)</span></div></div>
<div class="swatch" style="flex:1"><div class="dot" style="background:var(--gx-danger)"></div><div class="nm">Danger</div><div class="row" style="margin-top:6px;gap:6px"><span class="chip" style="background:var(--gx-danger-soft);color:var(--gx-danger-fg)">soft</span><span class="hx">var(--gx-danger)</span></div></div>
<div class="swatch" style="flex:1"><div class="dot" style="background:var(--gx-info)"></div><div class="nm">Info</div><div class="row" style="margin-top:6px;gap:6px"><span class="chip" style="background:var(--gx-info-soft);color:var(--gx-info-fg)">soft</span><span class="hx">var(--gx-info)</span></div></div>
<div class="swatch" style="flex:1"><div class="dot" style="background:var(--gx-neutral)"></div><div class="nm">Neutral</div><div class="row" style="margin-top:6px;gap:6px"><span class="chip" style="background:var(--gx-neutral-soft);color:var(--gx-text-2)">soft</span><span class="hx">var(--gx-neutral)</span></div></div></div></div></body></html>
