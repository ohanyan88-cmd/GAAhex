<!DOCTYPE html><html data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css"></head><body><div class="card-wrap"><div class="lbl">ISP / Network status</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px 18px">
<div class="row" style="gap:7px"><span style="width:9px;height:9px;border-radius:50%;background:var(--gx-online);box-shadow:0 0 8px var(--gx-online)"></span><span style="font-size:12px">Online</span></div><div class="row" style="gap:7px"><span style="width:9px;height:9px;border-radius:50%;background:var(--gx-degraded);box-shadow:0 0 8px var(--gx-degraded)"></span><span style="font-size:12px">Degraded</span></div><div class="row" style="gap:7px"><span style="width:9px;height:9px;border-radius:50%;background:var(--gx-offline);box-shadow:0 0 8px var(--gx-offline)"></span><span style="font-size:12px">Offline</span></div>
<div class="row" style="gap:7px"><span style="width:9px;height:9px;border-radius:50%;background:var(--gx-provisioned);box-shadow:0 0 8px var(--gx-provisioned)"></span><span style="font-size:12px">Provisioned</span></div><div class="row" style="gap:7px"><span style="width:9px;height:9px;border-radius:50%;background:var(--gx-throttled);box-shadow:0 0 8px var(--gx-throttled)"></span><span style="font-size:12px">Throttled</span></div><div class="row" style="gap:7px"><span style="width:9px;height:9px;border-radius:50%;background:var(--gx-maintenance);box-shadow:0 0 8px var(--gx-maintenance)"></span><span style="font-size:12px">Maintenance</span></div>
<div class="row" style="gap:7px"><span style="width:9px;height:9px;border-radius:50%;background:var(--gx-quarantined);box-shadow:0 0 8px var(--gx-quarantined)"></span><span style="font-size:12px">Quarantined</span></div><div class="row" style="gap:7px"><span style="width:9px;height:9px;border-radius:50%;background:var(--gx-unknown);box-shadow:0 0 8px var(--gx-unknown)"></span><span style="font-size:12px">Unknown</span></div><div class="row" style="gap:7px"><span style="width:9px;height:9px;border-radius:50%;background:var(--gx-quality-good);box-shadow:0 0 8px var(--gx-quality-good)"></span><span style="font-size:12px">SLA met</span></div>
</div><div class="row" style="gap:12px;margin-top:4px"><span class="lbl">Quality</span><div class="row" style="gap:7px"><span style="width:9px;height:9px;border-radius:50%;background:var(--gx-quality-good);box-shadow:0 0 8px var(--gx-quality-good)"></span><span style="font-size:12px">Good</span></div><div class="row" style="gap:7px"><span style="width:9px;height:9px;border-radius:50%;background:var(--gx-quality-warn);box-shadow:0 0 8px var(--gx-quality-warn)"></span><span style="font-size:12px">Warn</span></div><div class="row" style="gap:7px"><span style="width:9px;height:9px;border-radius:50%;background:var(--gx-quality-bad);box-shadow:0 0 8px var(--gx-quality-bad)"></span><span style="font-size:12px">Bad</span></div></div></div></body></html>
